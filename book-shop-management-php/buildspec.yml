version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2
    commands:
      - echo "Installing PHP 8.2"
      - php --version

  pre_build:
    commands:
      - echo "Preparing PHP Book Shop Management Project"
      - echo "Checking project directory"

  build:
    commands:
      - echo "Starting PHP Build"
      - |
        APP_DIR="folaneganesh75-afk-book-shop-managenemt-php/book-shop-management-php"
        cd "$APP_DIR"

        echo "Checking PHP files"
        find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./.git/*" -print0 | xargs -0 -r -n1 php -l

        echo "PHP Build Completed Successfully"

  post_build:
    commands:
      - echo "PHP project build finished successfully"

artifacts:
  base-directory: folaneganesh75-afk-book-shop-managenemt-php/book-shop-management-php
  files:
    - '**/*'